name: Synthetic planner checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preserved skill sources
        shell: pwsh
        run: ./scripts/verify-foundation.ps1
      - name: Test domain, persistence and server
        run: npm test
      - name: Prepare disposable browser runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/browser-bin"
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              Path(os.environ['RUNNER_TEMP'], 'browser-bin', 'chromium').symlink_to(p.chromium.executable_path)
          PY
          echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
      - name: Test synthetic browser workflows
        run: python test/browser_storage_smoke.py
